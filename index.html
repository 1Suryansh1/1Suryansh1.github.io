<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample Efficient Labs</title>
    <meta name="description" content="Sample Efficient Labs — coming soon." />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #0f0f0f;
        color: #f4f1ea;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(1.75rem, 5vw, 2.75rem);
        font-weight: 400;
        letter-spacing: 0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #b8b3a8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sample Efficient Labs</h1>
      <p>Coming soon</p>
    </main>
  </body>
</html>
